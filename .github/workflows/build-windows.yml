#==============================================================================
# 构建 Windows 版 VST3 插件（GitHub Actions）
#
# 触发：推送到 main/master，或在 Actions 页面手动运行（workflow_dispatch）。
# 产物：Actions 运行页底部的 Artifacts
#   - DaweiDrumScore-Windows-x64     原始 .vst3 bundle（绿色版）
#   - DaweiDrumScore-Setup-Windows-x64  Inno Setup 安装器（双击即装）
#==============================================================================
name: 构建 Windows 版

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'dist/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1) 我们的源码
      - name: 检出插件源码
        uses: actions/checkout@v4

      # 2) VST3 SDK（含子模块）。需要固定版本时可加 ref: v3.8.1_build-84
      - name: 拉取 VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          path: vst3sdk
          submodules: recursive

      # 3) 诊断 runner 上的 Visual Studio，并配置 CMake。
      #    刻意【不写死】generator 版本：windows-latest 镜像会随年份升级 VS
      #    （写死 "Visual Studio 17 2022" 曾在找不到 VS 2022 的镜像上直接配置失败）。
      - name: 环境诊断
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            Write-Host "== 已安装的 Visual Studio =="
            & $vswhere -products * -format value -property displayName
            & $vswhere -products * -format value -property installationVersion
          } else {
            Write-Host "未找到 vswhere（可能未安装 Visual Studio）"
          }

      - name: 配置 CMake
        run: cmake -S . -B build -A x64

      # 4) 编译 Release（只构建本插件，跳过 SDK 自带示例，快很多）
      - name: 编译
        run: cmake --build build --config Release --target DaweiDrumScore --parallel

      # 5) 列出产物，方便排查
      - name: 定位产物
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter *.vst3 |
            ForEach-Object { Write-Host "找到：$($_.FullName)" }

      # 6) 上传原始 bundle（绿色版：解压后手动放进 VST3 目录即可）
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DaweiDrumScore-Windows-x64
          path: build/**/*.vst3
          if-no-files-found: error

      # 7) 打 Windows 安装器（Inno Setup）。镜像通常预装 Inno，找不到才装。
      - name: 制作安装器（Inno Setup）
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                   Select-Object -First 1).FullName
          if (-not $iscc) {
            Write-Host "未预装 Inno Setup，尝试安装…"
            choco install innosetup -y --no-progress
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" |
                     Select-Object -First 1).FullName
          }
          Write-Host "ISCC = $iscc"
          & $iscc "installer\windows\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败，退出码 $LASTEXITCODE" }
          Get-ChildItem build\setup-out |
            ForEach-Object { Write-Host ("生成安装器：{0}  {1:N0} 字节" -f $_.Name, $_.Length) }

      # 8) 上传安装器
      - name: 上传安装器
        uses: actions/upload-artifact@v4
        with:
          name: DaweiDrumScore-Setup-Windows-x64
          path: build/setup-out/*.exe
          if-no-files-found: error
